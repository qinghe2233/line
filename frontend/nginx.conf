server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ============ gzip ============
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ============ 全局超时 / keepalive ============
    keepalive_timeout 32s;
    send_timeout      60s;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ============ 健康检查 endpoint ============
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ============ 静态资源（带 Cache-Control ============
    # Vite 构建产物带 hash，可长期缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|avif|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ============ API 反代 ============
    # 后端服务名：backend（docker-compose 里的 service 名）
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         8 32k;
    }

    # ============ SPA 路由 fallback ============
    # 除了 /api/ 和真正存在的静态文件，全部返回 index.html，让前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}
