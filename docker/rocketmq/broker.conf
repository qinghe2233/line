brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
listenPort = 10911
autoCreateTopicEnable = true

# broker 向 nameserver 上报的地址。
# 容器内全链路部署时用 compose 内部 DNS 名称，后端客户端能正确解析并连接。
# 若只想把应用跑在宿主机（local profile），请改回 127.0.0.1。
brokerIP1 = rocketmq-broker
